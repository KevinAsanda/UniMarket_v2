<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sell Item – UniMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/listing.css">

</head>
<body>

<!-- ── DYNAMIC NAVBAR ───────────────────────────── -->
<nav class="topbar">
  <a class="logo" href="cat.html">🏫 UniMarket</a>
  <div class="nav-links">
    <a href="cat.html"      class="nav-link">Catalogue</a>
    <a href="listing.html"  class="nav-link active">Sell</a>
    <a href="activity.html" class="nav-link">Activity</a>
  </div>
  <div class="nav-right">
    <div class="user-pill">
      <span class="user-avatar" id="userAvatar">?</span>
      <span class="user-name"   id="username">Loading…</span>
    </div>
    <button class="btn-signout" onclick="signOut()">Sign Out</button>
    <button class="hamburger" id="hamburgerBtn" onclick="toggleMobileMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="mobile-drawer" id="mobileDrawer">
  <a href="cat.html"      class="drawer-link">📚 Catalogue</a>
  <a href="listing.html"  class="drawer-link active">🏷️ Sell</a>
  <a href="activity.html" class="drawer-link">📦 Activity</a>
  <hr style="border-color:#e5e7eb;margin:8px 0">
  <button class="drawer-signout" onclick="signOut()">Sign Out</button>
</div>
<div class="drawer-overlay" id="drawerOverlay" onclick="closeMobileMenu()"></div>

<!-- CARD -->
<div class="main-card">
  <h4 class="mb-4">Sell an Item</h4>

  <!-- STEP 1 -->
  <div class="step-card">
    <div class="section-title">Step 1: Item Basics</div>
    <input id="itemName"  class="form-control mb-2" placeholder="Item Name">
    <input id="itemPrice" class="form-control mb-2" placeholder="Price (R)">
    <select id="category" class="form-select mb-2">
      <option value="">— Loading categories… —</option>
    </select>
    <input id="quantity" class="form-control" type="number" min="1" value="1" placeholder="Quantity">
  </div>

  <!-- STEP 2 -->
  <div class="step-card">
    <div class="section-title">Step 2: Description &amp; Media</div>
    <textarea id="description" rows="4" class="form-control mb-3"
              placeholder="Describe your item…"></textarea>
    <input id="image" type="file" class="form-control" accept="image/*">
  </div>

  <!-- STEP 3 -->
  <div class="step-card">
    <div class="section-title">Step 3: Meet-up Availability</div>
    <div id="slotContainer"></div>
    <button class="btn btn-dark btn-sm mt-2" onclick="addSlot()" type="button">+ Add Slot</button>
  </div>

  <!-- SUBMIT -->
  <div class="text-end">
    <button id="btnSubmit" class="btn btn-success mt-3" onclick="submitItem()">List Item</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../javascript/supabase.js"></script>
<script src="../javascript/auth-session.js"></script>
<script src="../javascript/listing.js"></script>
<script>
function toggleMobileMenu(){document.getElementById('mobileDrawer').classList.toggle('open');document.getElementById('drawerOverlay').classList.toggle('open');}
function closeMobileMenu(){document.getElementById('mobileDrawer').classList.remove('open');document.getElementById('drawerOverlay').classList.remove('open');}
</script>
</body>
</html>
