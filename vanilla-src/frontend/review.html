<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Review – UniMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/review.css"/>
</head>
<body>

<div class="review-card">

  <div class="review-header">
    <h1>🤖 AI Listing Review</h1>
    <p>Your item is being reviewed before it goes live on the catalogue</p>
  </div>

  <div class="review-body">

    <!-- STEP INDICATOR -->
    <div class="steps">
      <div class="step done" id="stepListed">
        <div class="step-circle">✓</div>
        <div class="step-label">Listed</div>
      </div>
      <div class="step-line done"></div>
      <div class="step active" id="stepReview">
        <div class="step-circle">2</div>
        <div class="step-label">AI Review</div>
      </div>
      <div class="step-line" id="lineApprove"></div>
      <div class="step" id="stepApprove">
        <div class="step-circle">3</div>
        <div class="step-label">Live</div>
      </div>
    </div>

    <!-- STAGE 1: REVIEWING -->
    <div class="stage active" id="stageReviewing">
      <div class="ai-spinner">
        <div class="spinner-ring"></div>
        <p class="ai-status" id="aiStatusText">Connecting to AI reviewer…</p>
      </div>
    </div>

    <!-- STAGE 2: RESULT -->
    <div class="stage" id="stageResult">

      <div id="verdictBox"></div>
      <div class="ai-notes" id="aiNotesBox"></div>
      <div class="product-preview" id="productPreview"></div>

      <div id="resultActions"></div>

    </div>

  </div><!-- /review-body -->
</div>

<a class="logo-link" href="cat.html">← Back to Catalogue</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../javascript/supabase.js"></script>
<script src="../javascript/auth-session.js"></script>
<script src="../javascript/review.js"></script>
</body>
</html>
