## UniMarket v2 — Render Blueprint
## This file defines the Render deployment for the frontend static site.
## The Supabase backend (DB, Auth, Edge Functions) is hosted separately on supabase.com.
##
## How to use:
##   1. Push this repo to GitHub.
##   2. Go to https://dashboard.render.com → New → Blueprint.
##   3. Connect your GitHub repo. Render will detect this file automatically.
##   4. Set the environment variables listed below in the Render dashboard.

services:
  - type: web
    name: unimarket-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    ## SPA routing — redirect all 404s back to index.html so React Router works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      ## ── Supabase (required) ──────────────────────────────────────────────
      ## Get these from: Supabase Dashboard → Project Settings → API
      - key: VITE_SUPABASE_URL
        sync: false   # Set manually in Render dashboard — never commit secrets

      - key: VITE_SUPABASE_ANON_KEY
        sync: false   # Set manually in Render dashboard — never commit secrets

      ## ── PayFast (optional — leave blank to use cash-on-meetup fallback) ──
      ## Get these from: https://www.payfast.co.za → Merchant Account → Integration
      - key: VITE_PAYFAST_MERCHANT_ID
        sync: false

      - key: VITE_PAYFAST_MERCHANT_KEY
        sync: false

      ## Set to "false" only when you are ready for live (real money) payments
      - key: VITE_PAYFAST_SANDBOX
        value: "true"

      ## Format: https://<supabase-project-ref>.supabase.co/functions/v1/payfast-notify
      ## Leave blank if PayFast is not configured
      - key: VITE_PAYFAST_NOTIFY_URL
        sync: false
